<script>
(()=>{
const $=x=>document.getElementById(x),
p=$('p'),m=$('melon'),preview=$('previewMelons'),msg=$('msg'),call=$('call'),
time=$('time'),hit=$('hit'),quit=$('quit'),retry=$('retry'),
res=$('result'),phone=$('phone'),hl=$('hl'),hr=$('hr'),fx=$('fx');

let px=8,mx=70,dir=1,speed=.24,round=1,total=0,streak=0,successes=0,run=0,busy=0,
t0=0,last=0,raf,ct,speedTimer;
const dur=5000;
const R=(a,b)=>a+Math.random()*(b-a);

function clean(){
  hl.style.opacity=hr.style.opacity=0;
  fx.innerHTML='';
  phone.style.opacity=0;
  phone.classList.remove('crack');
  p.classList.remove('cry','swing');
  preview.innerHTML='';
}

function createCandidateMelons(){
  preview.innerHTML='';
  const count=Math.random()<.5?3:4;
  const positions=[];
  const minGap=16;
  let guard=0;

  while(positions.length<count && guard<200){
    const pos=R(12,88);
    if(positions.every(v=>Math.abs(v-pos)>=minGap)) positions.push(pos);
    guard++;
  }

  positions.sort((a,b)=>a-b);

  // 正解は候補のどれか1つ
  mx=positions[Math.floor(Math.random()*positions.length)];

  positions.forEach(pos=>{
    const d=document.createElement('div');
    d.className='previewMelon';
    d.style.left=pos+'%';
    preview.appendChild(d);
  });

  // 本物のスイカは判定用。ゲーム開始までは非表示。
  m.style.left=mx+'%';
  m.classList.add('hide');
}

function hideCandidates(){
  preview.innerHTML='';
}

function randomizeSpeed(){
  if(!run)return;

  // ときどき急加速、急減速。通常速度も毎回ランダム。
  const roll=Math.random();
  if(roll<0.18){
    speed=R(.52,.78); // 急に速い
  }else if(roll<0.36){
    speed=R(.07,.14); // 急に遅い
  }else{
    speed=R(.18,.38); // 通常
  }

  speedTimer=setTimeout(randomizeSpeed,R(350,900));
}

function shout(){
  if(!run)return;

  const z=mx-px;
  let words;

  if(Math.abs(z)<2.7){
    words=['そこ！','今だ！','止まれ！','そこだ！'];
  }else if(z>0){
    words=Math.abs(z)>20?['もっと右！','右へ！','右、右！']:['右！','もう少し右！','そのまま右！'];
  }else{
    words=Math.abs(z)>20?['もっと左！','左へ！','左、左！']:['左！','もう少し左！','そのまま左！'];
  }

  // 少しだけ曖昧な掛け声を混ぜる
  if(Math.random()<.12) words=['近い！','その辺！','いいぞ！'];

  call.textContent=words[Math.floor(Math.random()*words.length)];
  call.classList.add('on');
  setTimeout(()=>call.classList.remove('on'),480);
  ct=setTimeout(shout,R(520,900));
}


function finalRoundCutin(done){
  const fc=$('finalCut'),face=$('cutFace'),cm=$('cutMelon'),words=$('finalWords'),vs=$('vsScene');
  face.className='faceCut';
  cm.className='melonCut';
  fc.classList.remove('blueMood');

  if(successes>=2){
    face.classList.add('fireEyes');
    cm.classList.add('cracked');
  }else if(successes===1){
    cm.classList.add('scratch');
  }else{
    face.classList.add('blue');
    cm.classList.add('steel');
    fc.classList.add('blueMood');
  }

  words.classList.remove('go');
  vs.style.opacity='1';
  fc.classList.remove('dn');

  // VS first, then FINAL ROUND about 0.5 sec later.
  setTimeout(()=>{
    vs.style.opacity='.18';
    void words.offsetWidth;
    words.classList.add('go');
  },500);

  setTimeout(()=>{
    fc.classList.add('dn');
    vs.style.opacity='1';
    done();
  },1250);
}

function begin(){
  if(round===3){
    finalRoundCutin(()=>beginRoundCore());
    return;
  }
  beginRoundCore();
}
function beginRoundCore(){
  clean();
  $('r').textContent=round;

  createCandidateMelons();

  // キャラは左端寄りから開始。以後、端から端まで往復。
  px=8;
  dir=1;
  speed=R(.18,.38);
  p.style.left=px+'%';

  msg.innerHTML='スイカの場所を覚えて！<small>この中のどれか1つが正解です</small>';
  hit.classList.remove('dn');
  hit.disabled=true;

  setTimeout(()=>{
    hideCandidates();
    msg.innerHTML='全部消えた！<small>掛け声だけを頼りに狙え！</small>';
    hit.disabled=false;
    run=1;
    busy=0;
    t0=last=performance.now();

    randomizeSpeed();
    shout();
    raf=requestAnimationFrame(loop);
  },1300);
}

function loop(n){
  if(!run)return;

  const dt=Math.min(32,n-last);
  last=n;

  // 端から端まで往復。向きは端に着いた時だけ反転。
  px += dir*speed*dt*.12;

  if(px>=94){
    px=94;
    dir=-1;
  }else if(px<=6){
    px=6;
    dir=1;
  }

  p.style.left=px+'%';

  const e=n-t0;
  time.style.transform=`scaleX(${Math.max(0,1-e/dur)})`;

  if(e>=dur)return strike(1);
  raf=requestAnimationFrame(loop);
}

function burst(){
  const w=$('stage').clientWidth,cx=w*mx/100,cy=$('stage').clientHeight-100;
  for(let i=0;i<25;i++){
    const q=document.createElement('i');
    q.className='bit';
    q.style.left=cx+'px';
    q.style.top=cy+'px';
    const a=Math.random()*6.28,l=R(50,150);
    q.style.setProperty('--x',Math.cos(a)*l+'px');
    q.style.setProperty('--y',Math.sin(a)*l+'px');
    fx.appendChild(q);
  }

  hl.style.left=`calc(${mx}% - 39px)`;
  hr.style.left=`calc(${mx}% + 1px)`;
  hl.style.opacity=hr.style.opacity=1;

  hl.animate(
    [{transform:'none'},{transform:'translate(-35px,20px) rotate(-35deg)'}],
    {duration:600,fill:'forwards'}
  );
  hr.animate(
    [{transform:'none'},{transform:'translate(35px,20px) rotate(35deg)'}],
    {duration:600,fill:'forwards'}
  );

  if(navigator.vibrate)navigator.vibrate([60,30,100]);
}

function strike(timeout=0){
  if(!run||busy)return;

  busy=1;
  run=0;
  cancelAnimationFrame(raf);
  clearTimeout(ct);
  clearTimeout(speedTimer);
  hit.disabled=true;

  const dist=Math.abs(px-mx);
  let pts=0,title='',sub='',fail=1,perfect=0;

  if(!timeout&&dist<=2.8){
    pts=1000;
    title='💥 粉砕！！';
    sub='ど真ん中！ +1000';
    fail=0;
    perfect=1;
  }else if(!timeout&&dist<=6.5){
    pts=650;
    title='🍉 命中！';
    sub='いい一撃！ +650';
    fail=0;
  }else if(!timeout&&dist<=11){
    pts=250;
    title='😆 惜しい！';
    sub='あと少し！ +250';
  }else{
    title=timeout?'⏰ 時間切れ！':'💨 空振り！';
    sub='MISS +0';
  }

  // FINAL ROUNDは成功・失敗に関係なく共通カットイン
  if(round===3){
    finalStrikeCinematic(()=>{
      resolveRound3Result({pts,title,sub,fail,perfect});
    });
    return;
  }

  // 1・2ラウンドは従来通り
  p.classList.add('swing');

  setTimeout(()=>{
    m.classList.remove('hide');

    if(perfect){
      successes++;
      burst();
      m.classList.add('hide');
    }else if(!fail){
      successes++;
    }

    total+=pts;
    $('s').textContent=total;
    streak=fail?streak+1:0;
    msg.innerHTML=title+'<small>'+sub+'</small>';

    setTimeout(()=>{
      round++;
      begin();
    },900);
  },130);
}

function finalStrikeCinematic(done){
  const cine=$('missCinema'),
        cf=$('cineFace'),
        sk=$('sokoda'),
        impact=$('impact'),
        black=$('blackout');

  
  quit.classList.add('dn');

  // ① スロー振り下ろし
  msg.innerHTML='……！<small>最後の一撃</small>';
  p.classList.remove('swing','cry','lookPhone');
  p.classList.add('slowSwing');

  setTimeout(()=>{
    // ② 顔アップ
    cine.classList.remove('dn');
    cf.style.opacity='1';

    setTimeout(()=>{
      // ③ そこだァ!!
      sk.style.opacity='1';

      setTimeout(()=>{
        sk.style.opacity='0';
        cf.style.opacity='0';

        // ④ バキィ!!
        impact.style.opacity='1';
        if(navigator.vibrate)navigator.vibrate([140,45,220]);

        setTimeout(()=>{
          impact.style.opacity='0';

          // ⑤ 暗転
          black.style.transition='opacity .15s';
          black.style.opacity='1';

          setTimeout(()=>{
            // 暗転状態のまま結果処理へ
            done();
          },650);
        },420);
      },560);
    },520);
  },760);
}

function resolveRound3Result(resultData){
  const {pts,title,sub,fail,perfect}=resultData;
  const cine=$('missCinema'),
        black=$('blackout');

  total+=pts;
  $('s').textContent=total;
  streak=fail?streak+1:0;
  if(!fail)successes++;

  // 結果表示用に棒人間のスロー状態を解除
  p.classList.remove('slowSwing');

  // 成功系：暗転明けにスイカの結果を見せる
  if(!fail){
    m.classList.remove('hide');

    if(perfect){
      burst();
      m.classList.add('hide');
    }

    black.style.opacity='0';

    setTimeout(()=>{
      cine.classList.add('dn');
      msg.innerHTML=title+'<small>'+sub+'</small>';

      setTimeout(finish,1200);
    },180);

    return;
  }

  // 失敗系
  // 3連続失敗なら、暗転明けで割れたスマホを見る演出へ
  if(streak>=3){
    phone.style.opacity=1;
    phone.style.left=px+'%';
    phone.classList.add('crack');

    black.style.opacity='0';

    setTimeout(()=>{
      cine.classList.add('dn');
      p.classList.add('lookPhone');
      msg.innerHTML='…………<small>割れたスマホを見つめる</small>';

      setTimeout(()=>{
        p.classList.remove('lookPhone');
        p.classList.add('cry');
        msg.innerHTML='😭 うわあああ……<small>膝から崩れ落ちた</small>';

        setTimeout(finish,1600);
      },1050);
    },180);

    return;
  }

  // 3連続失敗でない普通の失敗
  m.classList.remove('hide');
  black.style.opacity='0';

  setTimeout(()=>{
    cine.classList.add('dn');
    msg.innerHTML=title+'<small>'+sub+'</small>';
    setTimeout(finish,1200);
  },180);
}

function disaster(){
  // v7ではFINAL ROUNDの失敗分岐はresolveRound3Result()内で処理
}

function finish(){
  hit.classList.add('dn');
  
  quit.classList.remove('dn');

  const title=
    total>=2600?'🏆 スイカ割り名人！':
    total>=1600?'👏 かなり上手！':
    total>=700?'🍉 まずまず！':
    '😂 修行が必要！';

  $('rt').textContent=title;
  $('rs').textContent=total+'点';
  $('rx').textContent=
    streak>=3
      ?'3連続失敗。最後はスマホまで犠牲に……。'
      :'3ラウンド終了！';

  res.classList.remove('dn');
}

function restart(){
  round=1;
  total=0;
  streak=0;
  successes=0;
  $('s').textContent=0;
  res.classList.add('dn');
  
  quit.classList.add('dn');
  retry.classList.add('dn');
  begin();
}

$('start').onclick=()=>{
  $('intro').classList.add('dn');
  restart();
};

hit.onclick=()=>strike(0);
$('close').onclick=()=>res.classList.add('dn');
retry.onclick=restart;

quit.onclick=()=>{
  run=0;
  cancelAnimationFrame(raf);
  clearTimeout(ct);
  clearTimeout(speedTimer);
  res.classList.add('dn');
  
  quit.classList.add('dn');
  retry.classList.remove('dn');
  msg.innerHTML='また挑戦してね 🍉<small>遊んでくれてありがとう！</small>';
};



window.onkeydown=e=>{
  if(e.code==='Space'){
    e.preventDefault();
    strike(0);
  }
};

m.classList.add('hide');
p.style.left=px+'%';
})();
</script>
