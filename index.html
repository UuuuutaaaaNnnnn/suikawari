<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>目隠しスイカ割り</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:#222;display:flex;justify-content:center}#g{width:min(100%,520px);height:100svh;min-height:620px;position:relative;overflow:hidden;background:linear-gradient(#bdefff 0 45%,#75cddd 45% 56%,#f2d28b 56%)}header{height:62px;padding:12px;display:flex;justify-content:space-between;font-weight:900}.hud{background:#fff9;border-radius:20px;padding:7px 10px;font-size:13px}#stage{position:absolute;inset:62px 0 115px}.sun{position:absolute;right:25px;top:18px;width:62px;height:62px;border-radius:50%;background:#ffd54a}.bar{position:absolute;top:8px;left:7%;right:7%;height:10px;background:#fff9;border-radius:8px;overflow:hidden}#time{height:100%;background:#ef553f;transform-origin:left}.msg,#call{position:absolute;left:5%;right:5%;text-align:center;font-weight:1000;text-shadow:0 2px #fff,0 0 9px #fff;z-index:8}.msg{top:145px;font-size:28px}.msg small{display:block;font-size:14px;margin-top:7px}#call{top:78px;font-size:34px;opacity:0;transform:scale(.7);transition:.13s}#call.on{opacity:1;transform:scale(1)}
#melon,.previewMelon{position:absolute;bottom:62px;width:74px;height:74px;transform:translateX(-50%);border-radius:50%;background:repeating-linear-gradient(100deg,#2ea856 0 12px,#126d37 12px 20px);border:4px solid #0b5829;box-shadow:0 7px #0002;transition:opacity .25s}.previewMelon{transform:translateX(-50%);border-radius:50%;background:repeating-linear-gradient(100deg,#2ea856 0 12px,#126d37 12px 20px);border:4px solid #0b5829;box-shadow:0 7px #0002;z-index:3}.hide{opacity:0!important}
#p{position:absolute;bottom:58px;width:90px;height:190px;transform:translateX(-50%);z-index:5}.head{position:absolute;left:24px;width:42px;height:42px;border-radius:50%;background:#efc19b;border:3px solid #222}.blind{position:absolute;left:17px;top:14px;width:55px;height:13px;background:#222;border-radius:8px}.body{position:absolute;left:27px;top:41px;width:37px;height:69px;background:#fff0cb;border:3px solid #222;border-radius:13px}.arm,.leg{position:absolute;width:13px;border:3px solid #222;border-radius:8px}.arm{height:64px;top:50px;background:#efc19b}.arm.a{left:17px;transform:rotate(18deg)}.arm.b{right:16px;transform:rotate(-18deg)}.leg{height:69px;top:106px;background:#46698d}.leg.a{left:29px;transform:rotate(5deg)}.leg.b{left:51px;transform:rotate(-5deg)}#stick{position:absolute;left:43px;top:-57px;width:8px;height:160px;background:#8b592c;border:2px solid #4c2d12;border-radius:5px;transform-origin:50% 150px;transform:rotate(-18deg);transition:.13s}#p.swing #stick{transform:rotate(75deg)}
.half{position:absolute;bottom:62px;width:39px;height:68px;background:#ef4960;border:6px solid #1c873f;opacity:0;z-index:7}.hl{border-radius:60px 4px 4px 60px}.hr{border-radius:4px 60px 60px 4px}#fx{position:absolute;inset:0;pointer-events:none;z-index:9}.bit{position:absolute;width:10px;height:10px;background:#ef4960;border-radius:50%;animation:fly .7s forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(500deg);opacity:0}}
#phone{position:absolute;bottom:55px;width:32px;height:54px;background:#222;border:3px solid #111;border-radius:7px;opacity:0;transform:translateX(-50%)}#phone:after{content:"";position:absolute;inset:5px;background:#9bd7ee}#phone.crack:after{background:linear-gradient(45deg,transparent 46%,#222 47% 52%,transparent 53%),linear-gradient(-35deg,transparent 46%,#222 47% 51%,transparent 52%),#9bd7ee}#p.cry{animation:fall .6s forwards}@keyframes fall{to{transform:translateX(-50%) translateY(55px) rotate(12deg)}}#tear{position:absolute;left:34px;top:31px;font-size:24px;opacity:0}#p.cry #tear{opacity:1}
.controls{position:absolute;bottom:0;left:0;right:0;min-height:115px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#fff9;display:grid;grid-template-columns:1fr 1fr;gap:9px;z-index:20}button{border:0;border-radius:15px;padding:14px;font-size:17px;font-weight:900;box-shadow:0 4px #0002}.hit{grid-column:1/-1;background:#ef553f;color:#fff;font-size:24px}.share{background:#111;color:#fff}.quit{background:#fff;border:2px solid #ccc}.retry{grid-column:1/-1;background:#f2c44d}.dn{display:none!important}.ov{position:absolute;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px}.card{background:#fff;border-radius:22px;padding:23px;text-align:center;width:100%;box-shadow:0 18px 50px #0005}.card h1{margin:0 0 8px}.card p{line-height:1.65}.card button{width:100%;background:#ef553f;color:#fff}#rs{font-size:46px;font-weight:1000}
</style></head><body><div id="g"><header><div>🍉 目隠しスイカ割り</div><div class="hud">ROUND <span id="r">1</span>/3　<span id="s">0</span>点</div></header><div id="stage"><div class="sun"></div><div class="bar"><div id="time"></div></div><div id="call"></div><div id="msg" class="msg"></div><div id="previewMelons"></div><div id="melon"></div><div id="hl" class="half hl"></div><div id="hr" class="half hr"></div><div id="phone"></div><div id="p"><div class="head"></div><div class="blind"></div><div class="body"></div><div class="arm a"></div><div class="arm b"></div><div class="leg a"></div><div class="leg b"></div><div id="stick"></div><div id="tear">💧💧</div></div><div id="fx"></div></div><div class="controls"><button id="hit" class="hit dn">振り下ろす！</button><button id="share" class="share dn">𝕏 で結果をシェア</button><button id="quit" class="quit dn">やめる</button><button id="retry" class="retry dn">もう一度遊ぶ</button></div><div id="intro" class="ov"><div class="card"><h1>🍉 目隠しスイカ割り</h1><p>最初に<b>3〜4個のスイカ候補</b>が出ます。<br>ゲームが始まると全部消えます。<br><b>「右！」「左！」</b>の掛け声だけを頼りに、本物の位置を当てろ！</p><p>3ラウンド・約15秒勝負</p><button id="start">挑戦する</button></div></div><div id="result" class="ov dn"><div class="card"><h1 id="rt"></h1><div id="rs"></div><p id="rx"></p><button id="close">閉じる</button></div></div></div>

<script>
(()=>{
const $=x=>document.getElementById(x),
p=$('p'),m=$('melon'),preview=$('previewMelons'),msg=$('msg'),call=$('call'),
time=$('time'),hit=$('hit'),share=$('share'),quit=$('quit'),retry=$('retry'),
res=$('result'),phone=$('phone'),hl=$('hl'),hr=$('hr'),fx=$('fx');

let px=8,mx=70,dir=1,speed=.24,round=1,total=0,streak=0,run=0,busy=0,
t0=0,last=0,raf,ct,speedTimer;
const dur=5000;
const R=(a,b)=>a+Math.random()*(b-a);

function clean(){
  hl.style.opacity=hr.style.opacity=0;
  fx.innerHTML='';
  phone.style.opacity=0;
  phone.classList.remove('crack');
  p.classList.remove('cry','swing');
  preview.innerHTML='';
}

function createCandidateMelons(){
  preview.innerHTML='';
  const count=Math.random()<.5?3:4;
  const positions=[];
  const minGap=16;
  let guard=0;

  while(positions.length<count && guard<200){
    const pos=R(12,88);
    if(positions.every(v=>Math.abs(v-pos)>=minGap)) positions.push(pos);
    guard++;
  }

  positions.sort((a,b)=>a-b);

  // 正解は候補のどれか1つ
  mx=positions[Math.floor(Math.random()*positions.length)];

  positions.forEach(pos=>{
    const d=document.createElement('div');
    d.className='previewMelon';
    d.style.left=pos+'%';
    preview.appendChild(d);
  });

  // 本物のスイカは判定用。ゲーム開始までは非表示。
  m.style.left=mx+'%';
  m.classList.add('hide');
}

function hideCandidates(){
  preview.innerHTML='';
}

function randomizeSpeed(){
  if(!run)return;

  // ときどき急加速、急減速。通常速度も毎回ランダム。
  const roll=Math.random();
  if(roll<0.18){
    speed=R(.52,.78); // 急に速い
  }else if(roll<0.36){
    speed=R(.07,.14); // 急に遅い
  }else{
    speed=R(.18,.38); // 通常
  }

  speedTimer=setTimeout(randomizeSpeed,R(350,900));
}

function shout(){
  if(!run)return;

  const z=mx-px;
  let words;

  if(Math.abs(z)<2.7){
    words=['そこ！','今だ！','止まれ！','そこだ！'];
  }else if(z>0){
    words=Math.abs(z)>20?['もっと右！','右へ！','右、右！']:['右！','もう少し右！','そのまま右！'];
  }else{
    words=Math.abs(z)>20?['もっと左！','左へ！','左、左！']:['左！','もう少し左！','そのまま左！'];
  }

  // 少しだけ曖昧な掛け声を混ぜる
  if(Math.random()<.12) words=['近い！','その辺！','いいぞ！'];

  call.textContent=words[Math.floor(Math.random()*words.length)];
  call.classList.add('on');
  setTimeout(()=>call.classList.remove('on'),480);
  ct=setTimeout(shout,R(520,900));
}

function begin(){
  clean();
  $('r').textContent=round;

  createCandidateMelons();

  // キャラは左端寄りから開始。以後、端から端まで往復。
  px=8;
  dir=1;
  speed=R(.18,.38);
  p.style.left=px+'%';

  msg.innerHTML='スイカの場所を覚えて！<small>この中のどれか1つが正解です</small>';
  hit.classList.remove('dn');
  hit.disabled=true;

  setTimeout(()=>{
    hideCandidates();
    msg.innerHTML='全部消えた！<small>掛け声だけを頼りに狙え！</small>';
    hit.disabled=false;
    run=1;
    busy=0;
    t0=last=performance.now();

    randomizeSpeed();
    shout();
    raf=requestAnimationFrame(loop);
  },1300);
}

function loop(n){
  if(!run)return;

  const dt=Math.min(32,n-last);
  last=n;

  // 端から端まで往復。向きは端に着いた時だけ反転。
  px += dir*speed*dt*.12;

  if(px>=94){
    px=94;
    dir=-1;
  }else if(px<=6){
    px=6;
    dir=1;
  }

  p.style.left=px+'%';

  const e=n-t0;
  time.style.transform=`scaleX(${Math.max(0,1-e/dur)})`;

  if(e>=dur)return strike(1);
  raf=requestAnimationFrame(loop);
}

function burst(){
  const w=$('stage').clientWidth,cx=w*mx/100,cy=$('stage').clientHeight-100;
  for(let i=0;i<25;i++){
    const q=document.createElement('i');
    q.className='bit';
    q.style.left=cx+'px';
    q.style.top=cy+'px';
    const a=Math.random()*6.28,l=R(50,150);
    q.style.setProperty('--x',Math.cos(a)*l+'px');
    q.style.setProperty('--y',Math.sin(a)*l+'px');
    fx.appendChild(q);
  }

  hl.style.left=`calc(${mx}% - 39px)`;
  hr.style.left=`calc(${mx}% + 1px)`;
  hl.style.opacity=hr.style.opacity=1;

  hl.animate(
    [{transform:'none'},{transform:'translate(-35px,20px) rotate(-35deg)'}],
    {duration:600,fill:'forwards'}
  );
  hr.animate(
    [{transform:'none'},{transform:'translate(35px,20px) rotate(35deg)'}],
    {duration:600,fill:'forwards'}
  );

  if(navigator.vibrate)navigator.vibrate([60,30,100]);
}

function strike(timeout=0){
  if(!run||busy)return;

  busy=1;
  run=0;
  cancelAnimationFrame(raf);
  clearTimeout(ct);
  clearTimeout(speedTimer);
  hit.disabled=true;
  p.classList.add('swing');

  setTimeout(()=>{
    const dist=Math.abs(px-mx);
    let pts=0,title='',sub='',fail=1;

    // 判定後だけ正解スイカを表示
    m.classList.remove('hide');

    if(!timeout&&dist<=2.8){
      pts=1000;
      title='💥 粉砕！！';
      sub='ど真ん中！ +1000';
      fail=0;
      burst();
      m.classList.add('hide');
    }else if(!timeout&&dist<=6.5){
      pts=650;
      title='🍉 命中！';
      sub='いい一撃！ +650';
      fail=0;
    }else if(!timeout&&dist<=11){
      pts=250;
      title='😆 惜しい！';
      sub='あと少し！ +250';
    }else{
      title=timeout?'⏰ 時間切れ！':'💨 空振り！';
      sub='MISS +0';
    }

    total+=pts;
    $('s').textContent=total;
    streak=fail?streak+1:0;
    msg.innerHTML=title+'<small>'+sub+'</small>';

    setTimeout(()=>{
      if(round===3){
        if(fail&&streak>=3)disaster();
        else finish();
      }else{
        round++;
        begin();
      }
    },900);
  },130);
}

function disaster(){
  msg.innerHTML='😱 あっ！！<small>そこ、スイカじゃない！</small>';
  m.classList.add('hide');
  phone.style.opacity=1;
  phone.style.left=px+'%';
  p.classList.remove('swing');

  setTimeout(()=>p.classList.add('swing'),280);

  setTimeout(()=>{
    phone.classList.add('crack');
    if(navigator.vibrate)navigator.vibrate([100,40,180]);
    msg.innerHTML='📱 バキッ……<small>自分のスマホだった。</small>';

    setTimeout(()=>{
      p.classList.remove('swing');
      p.classList.add('cry');
      msg.innerHTML='😭 うわあああ……<small>割れた画面を前に泣き崩れた</small>';
      setTimeout(finish,1400);
    },750);
  },500);
}

function finish(){
  hit.classList.add('dn');
  share.classList.remove('dn');
  quit.classList.remove('dn');

  const title=
    total>=2600?'🏆 スイカ割り名人！':
    total>=1600?'👏 かなり上手！':
    total>=700?'🍉 まずまず！':
    '😂 修行が必要！';

  $('rt').textContent=title;
  $('rs').textContent=total+'点';
  $('rx').textContent=
    streak>=3
      ?'3連続失敗。最後はスマホまで犠牲に……。'
      :'3ラウンド終了！あなたも挑戦してみよう。';

  res.classList.remove('dn');
}

function restart(){
  round=1;
  total=0;
  streak=0;
  $('s').textContent=0;
  res.classList.add('dn');
  share.classList.add('dn');
  quit.classList.add('dn');
  retry.classList.add('dn');
  begin();
}

$('start').onclick=()=>{
  $('intro').classList.add('dn');
  restart();
};

hit.onclick=()=>strike(0);
$('close').onclick=()=>res.classList.add('dn');
retry.onclick=restart;

quit.onclick=()=>{
  run=0;
  cancelAnimationFrame(raf);
  clearTimeout(ct);
  clearTimeout(speedTimer);
  res.classList.add('dn');
  share.classList.add('dn');
  quit.classList.add('dn');
  retry.classList.remove('dn');
  msg.innerHTML='また挑戦してね 🍉<small>シェアしなくてもOK！</small>';
};

share.onclick=()=>{
  const text=`目隠しスイカ割りで ${total}点！🍉
あなたも挑戦！`;
  const u=location.href.startsWith('http')?location.href.split('#')[0]:'';
  window.open(
    'https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+(u?'&url='+encodeURIComponent(u):''),
    '_blank',
    'noopener'
  );
};

window.onkeydown=e=>{
  if(e.code==='Space'){
    e.preventDefault();
    strike(0);
  }
};

m.classList.add('hide');
p.style.left=px+'%';
})();
</script>
</body></html>
